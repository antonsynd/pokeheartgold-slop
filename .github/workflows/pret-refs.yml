name: pret-refs
# Fail PRs that mention pret issue/PR numbers (issue #36): GitHub cross-links
# them and notifies pret's maintainers. Escape with backticks: `pret#123`.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  pret-refs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | python3 tools/decomp_harness/pret_refs.py check

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --first-parent: skip commits authored upstream that a merge brought in.
          git log --first-parent --format='%H%n%B%n---END---' "$BASE..$HEAD" \
            | python3 tools/decomp_harness/pret_refs.py check --strict
