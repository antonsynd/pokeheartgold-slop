name: update-progress

on:
  push:
    branches: [master]
    paths:
      - 'main.lsf'
      - 'src/**'
      - 'asm/**'
      - 'tools/decomp_harness/coverage_ledger.json'
      - '.github/progress_reference.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update README progress
        run: python3 tools/update_readme_progress.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: auto-update progress bars"
          git push
