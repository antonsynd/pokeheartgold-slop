name: build

on:
  push:
    # mainline is this fork's working branch; master tracks upstream.
    # Only build when something that feeds the ROM changes.
    branches: [master, mainline]
    paths:
      - 'Makefile'
      - 'meson.build'
      - 'meson.options'
      - '**/meson.build'
      - 'meson/**'
      - 'subprojects/**'
      - 'main.lsf'
      - 'asm/**'
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'files/**'
      - 'heartgold.us/**'
      - 'soulsilver.us/**'
      - 'tools/**'
      - '!tools/decomp_harness/**'
      - '.github/workflows/build.yml'
  # No path filter: `build` is a required check, so it must report on every PR.
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two games share no build outputs, so they build on parallel runners.
  # pret's Meson build: metroskrew runs the Metrowerks tools natively on
  # Linux, and the NitroSDK tools are built from source, so no Wine.
  rom:
    name: rom (${{ matrix.game }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: HEARTGOLD
            name: heartgold
          - game: SOULSILVER
            name: soulsilver

    steps:
      - name: Install packages
        run: |
          # metroskrew's Linux binaries are 32-bit.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex g++ gcc-arm-none-eabi ninja-build pkg-config python3 \
            xz-utils nasm libc6:i386 libpng-dev

      - name: Checkout Repo
        uses: actions/checkout@v4

      # metroskrew, the meson checkout and the subproject sources are pinned by
      # the Makefile and the .wrap files, so they key the cache.
      - name: Cache toolchain and subprojects
        uses: actions/cache@v4
        with:
          path: |
            tools/metroskrew
            subprojects/*
            !subprojects/*.wrap
            !subprojects/packagefiles
          key: meson-deps-${{ hashFiles('Makefile', 'subprojects/*.wrap', 'subprojects/packagefiles/**') }}

      # Build everything first with `ninja -k 0`, so a failing run lists every
      # compile error, not just the first.
      - name: Build
        run: |
          make GAME_VERSION=${{ matrix.game }} setup_rom
          ninja -C build/${{ matrix.name }}.us -k 0 poke${{ matrix.name }}.us.nds

      # `check` builds the ROM, then runs the four sha1 tests (main, sub,
      # filesystem, ROM) against the retail hashes.
      - name: Compare
        run: make GAME_VERSION=${{ matrix.game }} check

      - name: Upload logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ github.run_id }}-${{ matrix.game }}
          path: build/*/meson-logs/
          retention-days: 3

  # src/meson.build and asm/meson.build are generated from main.lsf; fail if
  # they drift from it or if main.lsf names an object twice.
  lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Check the Meson source lists
        run: python3 tools/decomp_harness/meson_port.py lists --check

  # The status check the mainline ruleset requires: passes only if both games
  # built and matched, and the source lists are current.
  build:
    needs: [rom, lists]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.rom.result }}" = success && test "${{ needs.lists.result }}" = success
