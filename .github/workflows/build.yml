name: build

on:
  push:
    # mainline is this fork's working branch; master tracks upstream.
    # Only build when something that feeds the ROM changes.
    branches: [master, mainline]
    paths:
      - 'Makefile'
      - '*.mk'
      - 'main.lsf'
      - 'global.inc'
      - 'charmap.txt'
      - 'rom.rsf'
      - 'asm/**'
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'sub/**'
      - 'files/**'
      - 'heartgold.us/**'
      - 'soulsilver.us/**'
      - 'tools/**'
      - '!tools/decomp_harness/**'
      - '.github/workflows/build.yml'
      - '.github/actions/**'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: gcc-10
  CXX: g++-10
  COMPARE: 1
  # Wine's fixme/err chatter on stderr would become ::error:: annotations.
  WINEDEBUG: -all

jobs:
  # The two games share no build outputs, so they build on parallel runners.
  rom:
    name: rom (${{ matrix.game }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        game: [HEARTGOLD, SOULSILVER]

    steps:
      - name: Update and Install Software
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt -y --allow-downgrades install g++-10-multilib linux-libc-dev binutils-arm-none-eabi p7zip-full pkg-config libpugixml-dev ppa-purge
          sudo ppa-purge -y ppa:ubuntu-toolchain-r/test || true
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo add-apt-repository ppa:cybermax-dexter/sdl2-backport
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources
          sudo apt update
          sudo apt -y --allow-downgrades install --install-recommends winehq-stable

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Repo
        run: |
          mkdir -p ~/download
          cd ~/download
          # Toolchain assets, pinned and checksummed so the compiler can't
          # change under us. The Metrowerks compiler, assembler and linker
          # come from metroskrew (mid-kid/metroskrew, what pret's Meson build
          # uses): the same compilers relinked as Linux binaries, so they run
          # without Wine and give the same bytes. Wine still runs the NitroSDK
          # tools (makerom, makelcf, makebanner).
          ASSETS=https://github.com/pret/pokeheartgold/raw/79948ad5db02cb4dc190dbaa0c4b7848279bc61c
          wget $ASSETS/NitroSDK-3_2-060901.7z
          wget https://github.com/mid-kid/metroskrew/releases/download/0.1.3/metroskrew-linux.tar.xz
          sha256sum -c - <<'SHA256'
          0ee935e34237cb1954e657083cd80a31ec9de1aeddd9468cceef684cac75b491  NitroSDK-3_2-060901.7z
          2fec5ba308690a25157afc532ed87411a413501d43d85892ae4bfb9eb3975790  metroskrew-linux.tar.xz
          SHA256
          tar xJf metroskrew-linux.tar.xz -C ~
          7z x NitroSDK-3_2-060901.7z
          mv NitroSDK-3_2-060901/tools/bin $GITHUB_WORKSPACE/tools
          mv NitroSDK-3_2-060901/include/nitro/specfiles/ARM7-TS.lcf.template $GITHUB_WORKSPACE/sub/
          mv NitroSDK-3_2-060901/include/nitro/specfiles/ARM9-TS.lcf.template $GITHUB_WORKSPACE/
          mv NitroSDK-3_2-060901/include/nitro/specfiles/mwldarm.response.template $GITHUB_WORKSPACE/
        working-directory: ~

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master as of 2025-05-08
        with:
          swap-size-gb: 19

      - name: Build
        env:
          GAME_VERSION: ${{ matrix.game }}
          GAME_LANGUAGE: ENGLISH
          GAME_REVISION: 0
        run: make -j"$(nproc)" SKREW=$HOME/metroskrew 2> >(sed -r 's/^/::error::/')

      - name: Post error archive
        if: failure()
        continue-on-error: true
        run: find . -maxdepth 2 -type d \( -name build -or -name files \) -exec tar -czvhf failure.tar.gz {} +

      - name: Post error upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pokeheartgold-failure-${{ github.run_id }}-${{ matrix.game }}
          path: failure.tar.gz
          retention-days: 1

  # The status check the mainline ruleset requires: passes only if both games
  # built and matched.
  build:
    needs: rom
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.rom.result }}" = success
